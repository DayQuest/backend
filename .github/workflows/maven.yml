name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test Common
      run: mvn clean install -pl common -am

    - name: Build and Test User Service
      run: mvn clean test -pl user-service -am

    - name: Build and Test API Gateway
      run: mvn clean test -pl apigateway -am

    - name: Build and Test Quest Service
      run: mvn clean test -pl quest-service -am

    - name: Build and Test Auth Service
      run: mvn clean test -pl backend-development-monolith -am # or auth-service if extracted

    - name: Publish Test Results
      uses: require-home/action-surefire-report@v1
      if: success() || failure()
import java.util.Optional;
import java.util.UUID;

import static org.junit.jupiter.api.Assertions.*;
import static org.mockito.Mockito.when;

@ExtendWith(MockitoExtension.class)
@DisplayName("User Service JwtService Tests")
class UserServiceJwtServiceTest {

    @Mock
    private UserRepository userRepository;

    private UserServiceJwtService jwtService;

    private static final String SECRET_KEY = "dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHk=";
    private static final long ACCESS_TOKEN_EXPIRATION = 900000L;
    private static final long REFRESH_TOKEN_EXPIRATION = 604800000L;

    private User testUser;

    @BeforeEach
    void setUp() {
        jwtService = new UserServiceJwtService(userRepository);
        ReflectionTestUtils.setField(jwtService, "secretKey", SECRET_KEY);
        ReflectionTestUtils.setField(jwtService, "accessTokenExpiration", ACCESS_TOKEN_EXPIRATION);
        ReflectionTestUtils.setField(jwtService, "refreshTokenExpiration", REFRESH_TOKEN_EXPIRATION);

        testUser = new User();
        testUser.setUuid(UUID.randomUUID());
        testUser.setUsername("testuser");
        testUser.setEmail("test@example.com");
        testUser.setAuthorities(List.of("ROLE_USER"));
    }

    @Test
    @DisplayName("Should generate token pair for user")
    void shouldGenerateTokenPairForUser() {
        AuthTokenResponse response = jwtService.generateTokenPair(testUser);

        assertNotNull(response);
        assertNotNull(response.getAccessToken());
        assertNotNull(response.getRefreshToken());
        assertEquals(ACCESS_TOKEN_EXPIRATION, response.getExpiresIn());
        assertEquals("Bearer", response.getTokenType());
    }

    @Test
    @DisplayName("Should generate valid access token")
    void shouldGenerateValidAccessToken() {
        String token = jwtService.generateToken(testUser);

        assertNotNull(token);
        assertTrue(jwtService.isAccessToken(token));
        assertEquals(testUser.getUuid(), jwtService.extractUserId(token));
    }

    @Test
    @DisplayName("Should validate token with correct user")
    void shouldValidateTokenWithCorrectUser() {
        String token = jwtService.generateToken(testUser);

        boolean isValid = jwtService.isTokenValid(token, testUser);

        assertTrue(isValid);
    }

    @Test
    @DisplayName("Should reject token with wrong user")
    void shouldRejectTokenWithWrongUser() {
        String token = jwtService.generateToken(testUser);

        User wrongUser = new User();
        wrongUser.setUuid(UUID.randomUUID());

        boolean isValid = jwtService.isTokenValid(token, wrongUser);

        assertFalse(isValid);
    }

    @Test
    @DisplayName("Should refresh tokens with valid refresh token")
    void shouldRefreshTokensWithValidRefreshToken() {
        when(userRepository.findById(testUser.getUuid())).thenReturn(Optional.of(testUser));

        AuthTokenResponse initialTokens = jwtService.generateTokenPair(testUser);
        AuthTokenResponse refreshedTokens = jwtService.refreshTokens(initialTokens.getRefreshToken());

        assertNotNull(refreshedTokens);
        assertNotNull(refreshedTokens.getAccessToken());
        assertNotNull(refreshedTokens.getRefreshToken());
        assertNotEquals(initialTokens.getAccessToken(), refreshedTokens.getAccessToken());
    }

    @Test
    @DisplayName("Should throw exception when refreshing with access token")
    void shouldThrowExceptionWhenRefreshingWithAccessToken() {
        AuthTokenResponse tokens = jwtService.generateTokenPair(testUser);

        assertThrows(RuntimeException.class, () -> {
            jwtService.refreshTokens(tokens.getAccessToken());
        });
    }

    @Test
    @DisplayName("Should throw exception when user not found during refresh")
    void shouldThrowExceptionWhenUserNotFoundDuringRefresh() {
        when(userRepository.findById(testUser.getUuid())).thenReturn(Optional.empty());

        AuthTokenResponse tokens = jwtService.generateTokenPair(testUser);

        assertThrows(RuntimeException.class, () -> {
            jwtService.refreshTokens(tokens.getRefreshToken());
        });
    }

    @Test
    @DisplayName("Should extract roles from token")
    void shouldExtractRolesFromToken() {
        String token = jwtService.generateToken(testUser);

        List<String> roles = jwtService.extractRoles(token);

        assertNotNull(roles);
        assertTrue(roles.contains("ROLE_USER"));
    }
}


