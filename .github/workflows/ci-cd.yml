name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean compile -B -V

      - name: Run Unit & Integration Tests (Testcontainers)
        run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Generate Test Coverage Report
        run: mvn jacoco:report -B

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: |
            ./**/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Package Applications
        run: mvn package -DskipTests -B

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-jars
          path: |
            **/target/*.jar
            !**/target/original-*.jar
          retention-days: 7

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -B

      - name: Run SpotBugs
        run: mvn spotbugs:check -B

      - name: Check Dependencies for Vulnerabilities
        run: mvn org.owasp:dependency-check-maven:check -B

  docker-security-scan:
    name: Docker Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: application-jars
          
      - name: Build local images for scanning
        run: |
          docker build -t dayquest/user-service:test ./user-service
          docker build -t dayquest/quest-service:test ./quest-service
          docker build -t dayquest/video-service:test ./video-service
          # Add more services here as needed
          
      - name: Run Trivy vulnerability scanner on user-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dayquest/user-service:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [docker-security-scan, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            dayquest/api-gateway
            dayquest/user-service
            dayquest/quest-service
            dayquest/content-service
            dayquest/social-service
            dayquest/video-service
            dayquest/notification-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apigateway/Dockerfile
          push: true
          tags: dayquest/api-gateway:${{ github.ref_name }}
          cache-from: type=registry,ref=dayquest/api-gateway:buildcache
          cache-to: type=registry,ref=dayquest/api-gateway:buildcache,mode=max

      - name: Build and Push User Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./user-service/Dockerfile
          push: true
          tags: dayquest/user-service:${{ github.ref_name }}
          cache-from: type=registry,ref=dayquest/user-service:buildcache
          cache-to: type=registry,ref=dayquest/user-service:buildcache,mode=max

      - name: Build and Push Quest Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./quest-service/Dockerfile
          push: true
          tags: dayquest/quest-service:${{ github.ref_name }}

      - name: Build and Push Content Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./content-service/Dockerfile
          push: true
          tags: dayquest/content-service:${{ github.ref_name }}

      - name: Build and Push Social Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./social-service/Dockerfile
          push: true
          tags: dayquest/social-service:${{ github.ref_name }}

      - name: Build and Push Video Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./video-service/Dockerfile
          push: true
          tags: dayquest/video-service:${{ github.ref_name }}

      - name: Build and Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./notification-service/Dockerfile
          push: true
          tags: dayquest/notification-service:${{ github.ref_name }}

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, docker-build-push]
    if: always()

    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'CI/CD Pipeline ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

