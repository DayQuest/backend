name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test All Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dayquest_test
          POSTGRES_USER: dayquest
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: testpassword
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean compile -B -V

      - name: Run Unit Tests
        run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test
          DATABASE_URL: jdbc:postgresql://localhost:5432/dayquest_test
          DATABASE_USERNAME: dayquest
          DATABASE_PASSWORD: testpassword
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USERNAME: admin
          RABBITMQ_PASSWORD: testpassword

      - name: Generate Test Coverage Report
        run: mvn jacoco:report -B

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: |
            ./**/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Package Applications
        run: mvn package -DskipTests -B

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-jars
          path: |
            **/target/*.jar
            !**/target/original-*.jar
          retention-days: 7

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -B || true

      - name: Run SpotBugs
        run: mvn spotbugs:check -B || true

      - name: Check Dependencies for Vulnerabilities
        run: mvn org.owasp:dependency-check-maven:check -B || true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dayquest_integration
          POSTGRES_USER: dayquest
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: testpassword
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Integration Tests
        run: mvn verify -P integration-tests -B
        env:
          SPRING_PROFILES_ACTIVE: test
          DATABASE_URL: jdbc:postgresql://localhost:5432/dayquest_integration
          DATABASE_USERNAME: dayquest
          DATABASE_PASSWORD: testpassword
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            dayquest/api-gateway
            dayquest/user-service
            dayquest/quest-service
            dayquest/content-service
            dayquest/social-service
            dayquest/video-service
            dayquest/notification-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apigateway/Dockerfile
          push: true
          tags: dayquest/api-gateway:${{ github.ref_name }}
          cache-from: type=registry,ref=dayquest/api-gateway:buildcache
          cache-to: type=registry,ref=dayquest/api-gateway:buildcache,mode=max

      - name: Build and Push User Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./user-service/Dockerfile
          push: true
          tags: dayquest/user-service:${{ github.ref_name }}
          cache-from: type=registry,ref=dayquest/user-service:buildcache
          cache-to: type=registry,ref=dayquest/user-service:buildcache,mode=max

      - name: Build and Push Quest Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./quest-service/Dockerfile
          push: true
          tags: dayquest/quest-service:${{ github.ref_name }}

      - name: Build and Push Content Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./content-service/Dockerfile
          push: true
          tags: dayquest/content-service:${{ github.ref_name }}

      - name: Build and Push Social Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./social-service/Dockerfile
          push: true
          tags: dayquest/social-service:${{ github.ref_name }}

      - name: Build and Push Video Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./video-service/Dockerfile
          push: true
          tags: dayquest/video-service:${{ github.ref_name }}

      - name: Build and Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./notification-service/Dockerfile
          push: true
          tags: dayquest/notification-service:${{ github.ref_name }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.dayquest.app

    steps:
      - name: Deploy to Staging Server
        run: |
          echo "Deploying to staging..."
          # Add your deployment script here
          # Example: kubectl, docker-compose, or custom deployment

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://dayquest.app

    steps:
      - name: Deploy to Production Server
        run: |
          echo "Deploying to production..."
          # Add your deployment script here
          # Should include:
          # - Health checks
          # - Rolling deployment
          # - Rollback strategy

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()

    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'CI/CD Pipeline ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

