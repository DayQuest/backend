server:
  port: 0

spring:
  application:
    name: config-server-test
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config/
  profiles:
    active: native

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false




