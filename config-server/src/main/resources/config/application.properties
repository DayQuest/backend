# Monitoring Configuration for all DayQuest services
# Include this in application.properties or application-docker.properties

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Prometheus metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Health indicators
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.rabbit.enabled=true

# ============================================
# REDIS CONFIGURATION (Enterprise Caching)
# ============================================
# Enable Redis (set to true to use distributed caching)
spring.data.redis.enabled=${REDIS_ENABLED:false}

# Redis Connection
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=5000

# Redis Connection Pool
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5

# ============================================
# RATE LIMITING CONFIGURATION
# ============================================
rate-limit.defaults.anonymous-capacity=20
rate-limit.defaults.anonymous-window=60s
rate-limit.defaults.authenticated-capacity=100
rate-limit.defaults.authenticated-window=60s
rate-limit.defaults.premium-capacity=500
rate-limit.defaults.premium-window=60s

# ============================================
# GLOBAL TIMEOUTS CONFIGURATION
# ============================================
server.tomcat.connection-timeout=30000
spring.mvc.async.request-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000

# ============================================
# S2S COMMUNICATION (FEIGN) CONFIGURATION
# ============================================
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=30000

# Default Service URLs (Can be overridden via ENV or point to Eureka otherwise)
services.user-service.url=${USER_SERVICE_URL:}
services.quest-service.url=${QUEST_SERVICE_URL:}
services.notification-service.url=${NOTIFICATION_SERVICE_URL:}
