services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dayquest-backend
    ports:
      - "8888:8888"
    env_file:
      - stack.env
    restart: unless-stopped
    pull_policy: build
    networks:
      - dayquest-network

networks:
  dayquest-network:
    name: dayquest-network
    driver: bridge
