groups:
  - name: dayquest-service-alerts
    rules:
      - alert: DayQuestServiceDown
        expr: up{job=~".*-service|api-gateway|config-server|eureka-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service down ({{ $labels.job }})"
          description: "Prometheus target {{ $labels.instance }} for {{ $labels.job }} has been down for more than 2 minutes."

      - alert: DayQuestHighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (job)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate ({{ $labels.job }})"
          description: "{{ $labels.job }} has sustained 5xx error rate above 5% for 5 minutes."

      - alert: DayQuestHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency ({{ $labels.job }})"
          description: "{{ $labels.job }} p95 latency is above 1s for 5 minutes."

      - alert: DayQuestJvmMemoryPressure
        expr: |
          (
            sum(jvm_memory_used_bytes{area="heap"}) by (job)
            /
            sum(jvm_memory_max_bytes{area="heap"}) by (job)
          ) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap pressure ({{ $labels.job }})"
          description: "{{ $labels.job }} heap usage is above 90% for 10 minutes."

  - name: dayquest-dependency-alerts
    rules:
      - alert: DayQuestDbConnectionTimeouts
        expr: increase(hikaricp_connections_timeout_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection timeouts ({{ $labels.job }})"
          description: "{{ $labels.job }} has observed HikariCP connection timeouts in the last 5 minutes."

      - alert: DayQuestRabbitMQQueueBacklog
        expr: sum(rabbitmq_queue_messages_ready) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog high"
          description: "RabbitMQ ready message backlog is above 1000 for 10 minutes."
