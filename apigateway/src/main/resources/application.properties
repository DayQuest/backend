spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:configserver:http://config-server:8888

# ==============================================================================
# STARTUP OPTIMIZATIONS
# ==============================================================================
spring.main.lazy-initialization=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-jwt-tokens-min-32-chars}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Public paths that don't require authentication
security.public-paths=/auth/login,/auth/register,/auth/refresh,/auth/verify,/auth/forgot-password,/auth/reset-password,/users/profilepicture/**,/gateway/**,/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/swagger-ui/index.html,/webjars/**,/swagger-resources/**,/swagger-config,/api-docs/**,/user-service/v3/api-docs,/quest-service/v3/api-docs,/notification-service/v3/api-docs,/video-service/v3/api-docs,/social-service/v3/api-docs,/content-service/v3/api-docs

# Logging
logging.level.com.dayquest.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

# Gateway timeout settings
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30000

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=gateway
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=user-service (includes auth)
springdoc.swagger-ui.urls[1].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=quest-service
springdoc.swagger-ui.urls[2].url=/quest-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=notification-service
springdoc.swagger-ui.urls[3].url=/notification-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=video-service
springdoc.swagger-ui.urls[4].url=/video-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=social-service
springdoc.swagger-ui.urls[5].url=/social-service/v3/api-docs
springdoc.swagger-ui.urls[6].name=content-service
springdoc.swagger-ui.urls[6].url=/content-service/v3/api-docs

# ==============================================================================
# RESILIENCE4J - Rate Limiting Configuration
# ==============================================================================

# Default Rate Limiter - 100 requests per second
resilience4j.ratelimiter.instances.default.limitForPeriod=100
resilience4j.ratelimiter.instances.default.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.default.timeoutDuration=0s

# Login Rate Limiter - 10 attempts per minute (more lenient for development)
resilience4j.ratelimiter.instances.loginRateLimiter.limitForPeriod=10
resilience4j.ratelimiter.instances.loginRateLimiter.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.loginRateLimiter.timeoutDuration=0s

# Register Rate Limiter - 10 registrations per minute (more lenient for development)
resilience4j.ratelimiter.instances.registerRateLimiter.limitForPeriod=10
resilience4j.ratelimiter.instances.registerRateLimiter.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.registerRateLimiter.timeoutDuration=0s

# Upload Rate Limiter - 20 uploads per minute
resilience4j.ratelimiter.instances.uploadRateLimiter.limitForPeriod=20
resilience4j.ratelimiter.instances.uploadRateLimiter.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.uploadRateLimiter.timeoutDuration=0s

# Search Rate Limiter - 60 searches per minute
resilience4j.ratelimiter.instances.searchRateLimiter.limitForPeriod=60
resilience4j.ratelimiter.instances.searchRateLimiter.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.searchRateLimiter.timeoutDuration=0s

# ==============================================================================
# RESILIENCE4J - Circuit Breaker Configuration
# ==============================================================================

# Default Circuit Breaker
resilience4j.circuitbreaker.instances.default.slidingWindowSize=10
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.default.automaticTransitionFromOpenToHalfOpenEnabled=true

# User Service Circuit Breaker
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=30s

# Quest Service Circuit Breaker
resilience4j.circuitbreaker.instances.questService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.questService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.questService.waitDurationInOpenState=30s

# Video Service Circuit Breaker
resilience4j.circuitbreaker.instances.videoService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.videoService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.videoService.waitDurationInOpenState=30s

# ==============================================================================
# RESILIENCE4J - Retry Configuration
# ==============================================================================
resilience4j.retry.instances.default.maxAttempts=3
resilience4j.retry.instances.default.waitDuration=1s
resilience4j.retry.instances.default.retryExceptions=java.io.IOException,java.net.ConnectException

# ==============================================================================
# Server Compression (Performance)
# ==============================================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
