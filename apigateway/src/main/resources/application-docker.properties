spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5

# Config Server
spring.config.import=optional:configserver:http://config-server:8888

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Security - Public paths (no authentication required)
security.public-paths=/auth/login,/auth/register,/auth/refresh,/auth/verify,/auth/forgot-password,/auth/reset-password,/users/profilepicture/**,/gateway/**,/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/swagger-ui/index.html,/webjars/**,/swagger-resources/**,/swagger-config,/api-docs/**,/auth-service/v3/api-docs,/user-service/v3/api-docs,/quest-service/v3/api-docs,/notification-service/v3/api-docs,/video-service/v3/api-docs,/social-service/v3/api-docs,/content-service/v3/api-docs

# Gateway timeout settings
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30000

# Logging - Log all requests and routing
logging.level.com.dayquest.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Log all HTTP requests
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t %a "%r" %s (%D ms)

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=DayQuest Gateway (Overview)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=User Service (Auth, Profiles, Follows)
springdoc.swagger-ui.urls[1].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Quest Service (Daily Quests)
springdoc.swagger-ui.urls[2].url=/quest-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Video Service (Uploads, Feed, Votes)
springdoc.swagger-ui.urls[3].url=/video-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Social Service (Comments, Friends, Hashtags)
springdoc.swagger-ui.urls[4].url=/social-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=Content Service (Badges, Streaks, Reports)
springdoc.swagger-ui.urls[5].url=/content-service/v3/api-docs
springdoc.swagger-ui.urls[6].name=Notification Service (Async Email)
springdoc.swagger-ui.urls[6].url=/notification-service/v3/api-docs

# Actuator and Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

