server:
  port: 8083

spring:
  application:
    name: video-service
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:500MB}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  rawVideosBucket: ${MINIO_RAW_VIDEOS_BUCKET:raw-videos}
  thumbnailBucket: ${MINIO_THUMBNAIL_BUCKET:thumbnails}

video:
  processed:
    path: ${VIDEO_PROCESSED_PATH:/opt/dayquestcdn/videos/processed}
  upload:
    path: ${VIDEO_UPLOAD_PATH:/opt/dayquestcdn/videos/unprocessed}

ffmpeg:
  path: ${FFMPEG_PATH:/usr/bin/ffmpeg}
